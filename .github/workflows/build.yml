name: Build (CI)

on:
  pull_request:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: |
          ./gradlew --no-daemon clean build :fabric:remapJar :forge:remapJar

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            fabric/build/libs/*.jar
            forge/build/libs/*.jar
            common/build/libs/*.jar

